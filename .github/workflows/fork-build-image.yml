# Fork-only: build the web app image on GitHub's runners and publish it to
# GHCR, so a self-hosted deployment pulls the changed layers instead of having
# an operator ship the whole ~1 GB image over `docker save | ssh | docker load`.
#
# Not proposed upstream - it exists because this fork is deployed behind a
# corporate proxy where building on the target host is slow and awkward.
name: Fork - build and publish image

on:
  push:
    # Deliberately not every commit: an image is only wanted when something is
    # actually going to be deployed, and a build takes ~7 minutes. Tag the
    # commit to ask for one:
    #
    #   git tag deploy-$(date +%Y%m%d-%H%M) && git push fork --tags
    tags:
      - 'deploy-*'
  workflow_dispatch:

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        # Docker repository names must be lowercase, and the owner is not:
        # "ghcr.io/Catscrash/..." is rejected outright by buildx.
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/intuneget" >> "$GITHUB_OUTPUT"
          # A manual run has no tag to name the image after; fall back to the
          # run number so every build still gets a unique, stable tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "ref_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ref_tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk space
        # The repo carries ~750 MB of icons and the build adds node_modules and
        # two image layers on top; the runner's preinstalled toolchains are not
        # needed for a Docker build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # rewrite-timestamp makes the exporter apply SOURCE_DATE_EPOCH to the
          # file timestamps inside the layers. The build arg alone only dates
          # the image config - verified by reading a published layer back: its
          # entries still carried the checkout time.
          outputs: type=image,push=true,rewrite-timestamp=true
          # Two tags on purpose: the branch tag is what the deployment pulls,
          # the commit tag is what a rollback names.
          # Three tags: the channel the deployment tracks, the tag that
          # asked for this build, and the commit - the last two are what a
          # rollback names.
          tags: |
            ${{ steps.image.outputs.name }}:fork-main
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.ref_tag }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          # Layer cache in the Actions cache, so an ordinary code change
          # rebuilds only the app layer rather than reinstalling npm packages.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Fixed timestamp for everything this build writes into the layers.
          #
          # A layer's identity is the digest of its tar, and that tar carries
          # each file's mtime. The checkout writes fresh files every run, so
          # public/ - ~880 MB of icons, the bulk of the image - came out with a
          # different digest on every build even when not one icon had changed,
          # and every deployment host re-downloaded all of it. Measured on three
          # consecutive builds: that one layer changed each time while the base
          # layers did not.
          #
          # SOURCE_DATE_EPOCH clamps timestamps newer than its value, so a
          # checkout's "now" collapses to this constant and an unchanged
          # directory yields a byte-identical tar and the same digest. The value
          # has to be a constant rather than the commit time, which would vary
          # per build and defeat the point; it only sets how the image dates
          # itself, so the number is arbitrary (2023-11-14).
          build-args: |
            SOURCE_DATE_EPOCH=1700000000
          # Keep the published tag a plain image manifest: the deployment host
          # pulls it directly, and an attestation manifest list only adds
          # surface without being consumed anywhere.
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}:fork-main"
            echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.ref_tag }}"
            echo "${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
            echo '```'
            echo
            echo "Deploy on the target host:"
            echo
            echo '```'
            echo "cd /srv/intuneget && sudo docker compose pull && sudo docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
